name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Princípio do menor privilégio: o workflow só lê o repositório
permissions:
  contents: read

# Cancela execuções antigas da mesma branch quando chega um push novo
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unidade:
    name: Auditoria e testes Node (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Versões LTS com suporte (Node 20 chegou ao fim do suporte em abril/2026)
        node: [22, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configurar Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Instalar dependências (lockfile exato)
        run: npm ci

      - name: Auditoria de segurança das dependências
        run: npm audit --audit-level=high

      - name: Testes de unidade e servidor (node:test)
        run: npm test

  e2e:
    name: Testes de ponta a ponta (Playwright)
    needs: unidade
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências (lockfile exato)
        run: npm ci

      - name: Instalar Chromium do Playwright
        run: npx playwright install --with-deps chromium

      - name: Testes Playwright (desktop e mobile)
        run: npx playwright test

      - name: Publicar relatório do Playwright em caso de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
