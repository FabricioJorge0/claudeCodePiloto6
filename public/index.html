<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Governança de Projetos Ambientais</title>
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/js/app.js"></script>
</head>
<body>
  <header class="topo">
    <h1>Governança de Projetos Ambientais</h1>
    <p class="aviso" role="note">Ambiente de demonstração: todos os dados são fictícios e ficam salvos apenas neste navegador (localStorage).</p>
  </header>

  <main>
    <section aria-labelledby="titulo-resumo">
      <h2 id="titulo-resumo">Resumo</h2>
      <div id="resumo" class="resumo" data-testid="resumo"></div>
    </section>

    <section aria-labelledby="titulo-novo">
      <details class="painel">
        <summary><h2 id="titulo-novo">Novo projeto</h2></summary>
        <form id="form-projeto" class="formulario" data-testid="form-projeto" novalidate>
          <label>Nome <input name="nome" required minlength="3" maxlength="120"></label>
          <label>Município <input name="municipio" required minlength="2" maxlength="80"></label>
          <label>Responsável <input name="responsavel" required minlength="2" maxlength="80"></label>
          <label>Status
            <select name="status" required>
              <option value="planejamento">Planejamento</option>
              <option value="em_execucao">Em execução</option>
              <option value="atrasado">Atrasado</option>
              <option value="concluido">Concluído</option>
            </select>
          </label>
          <label>Prazo <input name="prazo" type="date" required></label>
          <label>Orçamento (R$) <input name="orcamento" type="number" min="0" step="0.01" required></label>
          <label>Progresso (%) <input name="progresso" type="number" min="0" max="100" step="1" value="0" required></label>
          <ul id="erros-form" class="erros" role="alert" data-testid="erros-form"></ul>
          <button type="submit" class="botao-salvar">Salvar projeto</button>
        </form>
      </details>
    </section>

    <section aria-labelledby="titulo-projetos">
      <div class="barra">
        <h2 id="titulo-projetos">Projetos</h2>
        <div class="acoes">
          <label class="filtro">
            Status
            <select id="filtro-status" data-testid="filtro-status">
              <option value="">Todos</option>
              <option value="planejamento">Planejamento</option>
              <option value="em_execucao">Em execução</option>
              <option value="atrasado">Atrasado</option>
              <option value="concluido">Concluído</option>
            </select>
          </label>
          <button type="button" id="restaurar" class="botao-secundario">Restaurar dados de exemplo</button>
        </div>
      </div>
      <p id="mensagem" class="mensagem" role="status" aria-live="polite"></p>
      <ul id="lista-projetos" class="lista" data-testid="lista-projetos"></ul>
    </section>
  </main>

  <dialog id="modal-confirmacao" class="modal" data-testid="modal-confirmacao"
          aria-labelledby="modal-titulo" aria-describedby="modal-mensagem">
    <h2 id="modal-titulo"></h2>
    <p id="modal-mensagem"></p>
    <div class="modal-acoes">
      <button type="button" id="modal-cancelar" class="botao-secundario">Cancelar</button>
      <button type="button" id="modal-confirmar" class="botao-primario"></button>
    </div>
  </dialog>

  <footer class="rodape">
    <p>Projeto piloto: ciclo de desenvolvimento seguro.</p>
  </footer>
</body>
</html>
